version: "3.8"

services:
  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: fineract_tenants
      MYSQL_USER: root
      MYSQL_PASSWORD: mysql
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - fineract-network
    command:
      - --init-command="CREATE DATABASE IF NOT EXISTS fineract_default;"

  fineract:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/fineract_tenants?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql
      - FINERACT_HIKARI_JDBC_URL=jdbc:mariadb://db:3306/fineract_tenants?allowPublicKeyRetrieval=true&useSSL=false
      - FINERACT_HIKARI_USERNAME=root
      - FINERACT_HIKARI_PASSWORD=mysql
      - FINERACT_HIKARI_DEFAULT_JDBC_URL=jdbc:mariadb://db:3306/fineract_default?allowPublicKeyRetrieval=true&useSSL=false
      - FINERACT_HIKARI_DEFAULT_USERNAME=root
      - FINERACT_HIKARI_DEFAULT_PASSWORD=mysql
    depends_on:
      - db
    networks:
      - fineract-network

networks:
  fineract-network:
    driver: bridge

volumes:
  mysql-data:
